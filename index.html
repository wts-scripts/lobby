<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WTS Lobby</title>
<meta name="description" content="Toutes les sorties de jeux avec compte à rebours, les mises à jour, l'actu et tes amis connectés, au même endroit.">
<meta name="theme-color" content="#12101c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/icon-192.png?v=2">
<meta property="og:title" content="WTS Lobby">
<meta property="og:description" content="Sorties de jeux, mises à jour, actus et amis connectés.">
<meta property="og:image" content="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" id="fontlink" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script>
// thème choisi appliqué avant l'affichage (pas de flash)
try{var P=JSON.parse(localStorage.getItem("lobby.prefs")||"{}"),r=document.documentElement;if(P.theme&&P.theme!=="system")r.dataset.theme=P.theme;var pl=P.palette||"graphite";if(pl!=="nuit")r.dataset.palette=pl}catch(e){}
</script>
<style>
/* Barre du haut (recherche) + onglets ; contenu sur une colonne ; fiche jeu en tiroir */
:root{
  --bg:#12101c; --surface:#1b1829; --raise:#252136; --line:#332e4a;
  --fg:#ece9f5; --muted:#9a94b3; --accent:#ff8a2a; --violet:#8b6cff; --on-accent:#1a0f02;
  --online:#3ccf8e; --ingame:#8b6cff; --away:#f2c14e; --off:#6b6585; --danger:#ff6b6b;
  --display:"Chakra Petch",system-ui,sans-serif; --ds:1; --ns:1; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f4fb; --surface:#fff; --raise:#eeeaf8; --line:#dcd6ec; --fg:#1c1830; --muted:#615a7d; --accent:#d9620a; --violet:#6a4ce0; --on-accent:#fff;
  --online:#14975e; --ingame:#6a4ce0; --away:#b7860e; --off:#9a94b3; --danger:#c62828; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f4fb; --surface:#fff; --raise:#eeeaf8; --line:#dcd6ec; --fg:#1c1830; --muted:#615a7d; --accent:#d9620a; --violet:#6a4ce0; --on-accent:#fff;
  --online:#14975e; --ingame:#6a4ce0; --away:#b7860e; --off:#9a94b3; --danger:#c62828; color-scheme:light}
*{box-sizing:border-box}
html{font-synthesis-weight:none}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font:700 calc(22px*var(--ds))/1 var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none}
.brand img{width:calc(34px*var(--ds));height:calc(34px*var(--ds));flex-shrink:0;display:block}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;font:500 16px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 38px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgb(0 0 0/.35);max-height:65vh;overflow-y:auto;z-index:6}
.results button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:8px 12px;font:500 15px var(--body);cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus-visible{background:var(--raise);outline:none}
.results img{width:36px;height:48px;object-fit:cover;border-radius:4px;flex:none;background:var(--raise)}
.results span{flex:1;min-width:0}
.results small{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}
.results .msg{padding:12px;color:var(--muted)}
.install{margin-left:auto}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
@media (min-width:900px){nav{flex-wrap:wrap;overflow:visible;row-gap:0}}
nav a{font:600 calc(14px*var(--ds)) var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:10px 11px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent)}
nav .count{font-family:var(--mono);font-size:11px;background:var(--raise);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--online)}
main{padding-block:24px 64px}
.note{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:20px}
.note b{color:var(--accent)}
.err{color:var(--danger);font-size:14px;margin:0 0 12px}
h2{font:700 calc(24px*var(--ds))/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--violet)}
.btn{font:600 14px var(--body);border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--raise);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible{outline:2px solid var(--violet)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* Bandeau */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:28px 24px 24px;min-height:320px;border-radius:14px;margin-bottom:28px;color:#fff;
  background:linear-gradient(0deg,rgb(10 8 20/.92) 8%,rgb(10 8 20/.25) 65%,rgb(10 8 20/.05)),var(--img,none) center/cover,#241c3d;border:1px solid var(--line);cursor:pointer}
.hero:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero .lbl{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#ffb070}
.hero h3{font:700 calc(clamp(28px,5vw,48px)*var(--ds))/1.05 var(--display);margin:6px 0 4px;text-wrap:balance}
.hero p{margin:0;color:rgb(255 255 255/.8)}
.clock{display:flex;gap:8px}
.clock div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;min-width:64px}
.clock b{display:block;font:700 calc(30px*var(--ns))/1 var(--mono);font-variant-numeric:tabular-nums}
.clock span{font:600 10px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.hero .clock div{background:rgb(10 8 20/.6);border-color:rgb(255 255 255/.15);backdrop-filter:blur(6px)}
.hero .clock span{color:rgb(255 255 255/.7)}
@media (max-width:700px){.hero{grid-template-columns:1fr;min-height:260px}.clock div{min-width:0;flex:1}.clock b{font-size:24px}}

/* Jaquettes */
.month{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;align-content:start;cursor:pointer;color:var(--fg);position:relative}
.game:hover{border-color:var(--violet)}
.game:focus-visible{outline:2px solid var(--accent)}
.game .pic{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--raise)}
.game .pic img{width:100%;height:100%;object-fit:cover;display:block}
.game .cd{position:absolute;left:8px;right:8px;bottom:8px;font:700 calc(13px*var(--ns)) var(--mono);font-variant-numeric:tabular-nums;color:#fff;background:rgb(10 8 20/.72);padding:5px 8px;border-radius:6px;backdrop-filter:blur(4px);text-align:center}
.game .cd.soon{color:#5ff0ad}
.game .body{padding:10px 12px 12px;display:grid;gap:4px}
.game .t{font:600 calc(15px*var(--ds))/1.25 var(--display);min-width:0;overflow-wrap:anywhere}
.game .d{font:500 12px var(--mono);color:var(--muted)}
.plats{display:flex;gap:4px;flex-wrap:wrap}
.plat{font:600 11px var(--mono);letter-spacing:.02em;padding:2px 6px;border-radius:5px;background:var(--raise);color:var(--muted)}
.star{position:absolute;top:8px;right:8px;z-index:1;background:rgb(10 8 20/.55);border:0;border-radius:8px;cursor:pointer;color:#cfc9e6;font-size:18px;line-height:1;padding:5px 7px}
.star[aria-pressed="true"]{color:#ff9d45}
.star:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:no-preference){.game .pic img{transition:transform .35s}.game:hover .pic img{transform:scale(1.05)}}
.skel{background:linear-gradient(90deg,var(--raise),var(--surface),var(--raise));background-size:200% 100%;border-radius:12px;aspect-ratio:3/4.6}
@media (prefers-reduced-motion:no-preference){.skel{animation:sk 1.4s infinite linear}}
@keyframes sk{to{background-position:-200% 0}}

/* Fils mises à jour / actus */
.feed{display:grid;gap:10px}
.item{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);text-decoration:none}
.item:hover{border-color:var(--violet)}
.item>div{min-width:0}
.item .thumb{width:100%;aspect-ratio:460/215;object-fit:cover;border-radius:8px;display:block;background:var(--raise)}
.item h4{margin:6px 0 4px;font:600 calc(17px*var(--ds))/1.3 var(--display)}
.item p{margin:0;color:var(--muted);font-size:15px}
.meta{font:500 12px var(--mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap}
.tag.patch{background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--violet)}
.tag.hotfix{background:color-mix(in srgb,var(--away) 22%,transparent);color:var(--away)}
.tag.saison{background:color-mix(in srgb,var(--online) 20%,transparent);color:var(--online)}
@media (max-width:640px){.item{grid-template-columns:1fr}}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--fg);text-decoration:none;display:grid;align-content:start}
.ncard:hover{border-color:var(--violet)}
.ncard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--raise)}
.ncard div{padding:12px 14px 14px;display:grid;gap:6px}
.ncard h4{margin:0;font:600 calc(17px*var(--ds))/1.3 var(--display)}
.ncard p{margin:0;color:var(--muted);font-size:14px}
.apps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.app{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);background:var(--raise);border-radius:99px;padding:4px 6px 4px 12px}
.app button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:99px}
.app button:hover{color:var(--danger)}
.addapp{position:relative;max-width:420px;margin-bottom:16px}
.addapp input,.field input{width:100%;font:500 15px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.addapp input:focus,.field input:focus{outline:2px solid var(--accent)}

/* Formulaires */
.field{display:grid;gap:4px}
.field label{font:600 13px var(--body)}

/* Tiroir */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,clamp(480px,48vw,920px));grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;overflow-x:hidden;background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:18px;align-content:start}
.drawer>*{min-width:0}
.drawer .banner{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-height:min(440px,48vh);width:100%;background:var(--raise)}
.drawer .banner>img{width:100%;height:100%;object-fit:cover;display:block}
.drawer .banner .cv{position:absolute;left:14px;bottom:-1px;width:92px;border-radius:8px 8px 0 0;box-shadow:0 6px 20px rgb(0 0 0/.5)}
.drawer h3{font:700 calc(30px*var(--ds))/1.1 var(--display);margin:0;text-wrap:balance}
.drawer h5{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.drawer .sum{display:block;color:var(--muted);font-size:15px;line-height:1.55}
.dtop{display:flex;justify-content:space-between;gap:8px}
.mini{display:grid;gap:8px}
.mini a{display:flex;gap:10px;color:var(--fg);text-decoration:none;align-items:center}
.mini img{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none;background:var(--raise)}
.mini span{font-size:14px;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* Réglages */
.set{display:grid;gap:28px}
.set h3{font:600 calc(13px*var(--ds)) var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:600 14px var(--body);border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.25)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pal{display:grid;gap:10px;text-align:left;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--pbg);color:var(--pfg);font:inherit}
.pal[aria-pressed="true"]{border-color:var(--accent)}
.pal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pal .sw{display:flex;gap:6px}
.pal .sw i{width:22px;height:22px;border-radius:6px;display:block}
.pal b{font:600 16px var(--body)}
.pal small{display:block;font-size:13px;opacity:.75}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fnt{display:grid;gap:4px;align-content:start;text-align:left;border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--surface);color:var(--fg)}
.fnt[aria-pressed="true"]{border-color:var(--accent)}
.fnt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fnt .fd{font-size:26px;line-height:1.1;font-weight:700}
.fnt .fn{font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.fnt .fb{font-size:14px;color:var(--muted)}
/* Lecteur intégré, vidéo, galerie */
.prose{font-size:16px;line-height:1.65;color:var(--fg);overflow-wrap:anywhere;min-width:0}
.prose h3{font:700 calc(20px*var(--ds))/1.25 var(--display);margin:22px 0 8px}
.prose h4{font:600 calc(17px*var(--ds))/1.3 var(--display);margin:18px 0 6px}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:20px}
.prose li{margin:3px 0}
.prose img{display:block;max-width:100%;height:auto;border-radius:8px;margin:12px 0}
.prose blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--line);color:var(--muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.prose a{color:var(--accent)}
.video{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;max-height:70vh;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 8px)/2);max-width:100%;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.gallery button{padding:0;border:0;background:var(--raise);border-radius:8px;overflow:hidden;cursor:zoom-in;scroll-snap-align:start;aspect-ratio:16/9}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery button:focus-visible{outline:2px solid var(--accent)}
@media (max-width:640px){.gallery{grid-auto-columns:85%}}
#lightbox{position:fixed;inset:0;z-index:40;background:rgb(5 4 10/.94);display:grid;place-items:center;padding:calc(48px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px))}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#lightbox button{position:absolute;background:rgb(255 255 255/.12);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:30px;line-height:1;cursor:pointer}
#lightbox button:focus-visible{outline:2px solid #fff}
#lightbox .lb-prev{left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
#lightbox .lb-next{right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
#lightbox .lb-close{right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#lightbox .lb-n{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:rgb(255 255 255/.8);font:500 13px var(--mono)}
/* Meta */
.linkbtn{background:none;border:0;padding:4px 2px;font:600 13px var(--body);color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--fg)}
.linkbtn[disabled]{opacity:.6;cursor:default;text-decoration:none}
.linkbtn:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.mbar{display:grid;gap:12px;margin-bottom:16px}
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mtools input{flex:1;min-width:180px;font:500 15px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.mtools input:focus{outline:2px solid var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;gap:10px;padding:0 16px 14px;min-width:0}
.mhead{margin:0 -16px;padding:12px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center;background:linear-gradient(90deg,rgb(10 8 20/.82),rgb(10 8 20/.45)),var(--mart) center/cover;color:#fff}
.mhead .plat{background:rgb(255 255 255/.16);color:#fff}
.mgame{font:600 13px var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard h4{margin:0;font:700 calc(24px*var(--ds))/1.1 var(--display);overflow-wrap:anywhere}
.slots{margin:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.slots div{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;background:var(--surface);padding:7px 10px}
.slots dt{font:600 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;align-self:center}
.slots dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.mcode{display:flex;gap:8px;align-items:center}
.mcode code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13px var(--mono);background:var(--raise);border-radius:6px;padding:8px 10px}
.mnotes{margin:0;color:var(--muted);font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.mfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mact{margin-left:auto;display:flex;gap:8px}
.vote{font:700 14px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.vote[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vote:focus-visible{outline:2px solid var(--violet)}
.madmin{margin-top:28px;color:var(--muted);font-size:14px}
.madmin summary{cursor:pointer;font-weight:600}
.madmin[open]{display:grid;gap:8px}
.mform{display:grid;gap:14px}
.mform .two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px}
.mform select,.mform textarea{width:100%;font:500 15px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.mform textarea{resize:vertical}
.mform select:focus,.mform textarea:focus{outline:2px solid var(--accent)}
#mslotsBox{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:6px;align-items:center}
.srow input{width:100%;font:500 15px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.srow input:focus{outline:2px solid var(--accent)}
@media (max-width:520px){.mform .two{grid-template-columns:1fr}}

/* Config PC */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:20px}
.preset{display:grid;gap:2px;text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit}
.preset[aria-pressed="true"]{border-color:var(--accent)}
.preset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.preset b{font:700 calc(17px*var(--ds)) var(--display)}
.preset span{font-size:14px;color:var(--muted)}
.preset small{font:600 13px var(--mono);color:var(--accent);margin-top:4px}
.pcgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
@media (max-width:900px){.pcgrid{grid-template-columns:minmax(0,1fr)}}
.parts{display:grid;gap:8px;min-width:0}
.part{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.part label{font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.part select{width:100%;min-width:0;font:600 15px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.part select:focus,.price input:focus{outline:2px solid var(--accent)}
.price{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--muted)}
.price input{width:100%;font:600 15px var(--mono);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right}
@media (max-width:640px){.part{grid-template-columns:1fr 110px}.part label{grid-column:1/-1}}
.pcsum{grid-template-columns:minmax(0,1fr);position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
@media (max-width:900px){.pcsum{position:static}}
.pcsum h5{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total span{font:600 14px var(--body);color:var(--muted)}
.total b{font:700 calc(32px*var(--ns)) var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.kv b{color:var(--fg);font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;font-size:14px;line-height:1.4}
.checks i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);font-style:normal;color:#fff}
.checks .err i{background:var(--danger)} .checks .warn i{background:var(--away);color:#1a1400} .checks .info i{background:var(--violet)} .checks .ok i{background:var(--online);color:#03140b}
.perf{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:minmax(80px,110px) minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;font-size:14px}
.pr span{color:var(--muted)}
.pr b{text-align:right;font-variant-numeric:tabular-nums}
.pr small{grid-column:2/4;font-weight:600}
.bar{height:8px;background:var(--raise);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.pcact{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pcsave{display:flex;gap:8px}
.pcsave input{flex:1;min-width:0;font:500 15px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pcsave input:focus{outline:2px solid var(--accent)}
.saved{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.saved li{display:flex;align-items:center;gap:8px}
.saved li .meta{margin-left:auto}
/* Menu configurable */
.navsep{display:flex;align-items:center;gap:6px;flex:none;margin:0 6px;padding-left:12px;border-left:1px solid var(--line);font:600 calc(10px*var(--ds)) var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;align-self:center;min-height:20px}
.navsep:empty{padding-left:0;margin:0 8px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:640px}
.mrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mrow.sep{grid-template-columns:auto auto auto minmax(0,1fr) auto;background:transparent;border-style:dashed}
.mrow.off input[data-mlabel]{opacity:.55}
.mrow.drag{opacity:.4}
.mrow.over{border-color:var(--accent)}
.grip{cursor:grab;color:var(--muted);letter-spacing:-2px;user-select:none}
.mv{display:flex;gap:2px}
.mv button{width:30px;height:30px;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:6px;cursor:pointer;font-size:14px}
.mv button[disabled]{opacity:.35;cursor:default}
.mv button:focus-visible{outline:2px solid var(--accent)}
.mrow input[data-mlabel]{width:100%;min-width:0;font:600 15px var(--body);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.mrow input[data-mlabel]:focus{outline:2px solid var(--accent)}
.mkind{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mvis{display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap}
.mvis input{width:18px;height:18px;accent-color:var(--accent)}
@media (max-width:480px){.grip{display:none}.mrow{grid-template-columns:auto minmax(0,1fr) auto}.mrow.sep{grid-template-columns:auto auto minmax(0,1fr) auto}}
/* Rubriques d'info */
.livetag{display:inline-block;background:#e91916;color:#fff;font:700 11px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:5px;vertical-align:middle}
.subh{font:700 calc(16px*var(--ds)) var(--display);letter-spacing:.06em;text-transform:uppercase;margin:24px 0 12px;display:flex;align-items:center}
.big{padding:12px 18px;font-size:16px;justify-content:center}
/* Événements */
.evhero{min-height:240px}
.evbig{font:700 calc(40px*var(--ns)) var(--mono)}
.evbig .evcd,.evbig .evnow{color:#fff}
.evlist{display:grid;gap:10px}
.evcard{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.evdate{display:grid;text-align:center;background:var(--raise);border-radius:10px;padding:8px 0}
.evdate b{font:700 calc(26px*var(--ns))/1 var(--mono)}
.evdate span{font:600 12px var(--mono);text-transform:uppercase;color:var(--muted)}
.evbody{display:grid;gap:6px;min-width:0}
.evbody h4{margin:0;font:700 calc(19px*var(--ds))/1.2 var(--display)}
.evwhen{margin:0;font-weight:600}
.evdesc{margin:0;color:var(--muted);font-size:14px}
.evcd{font:700 calc(18px*var(--ns)) var(--mono);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.evnow{font:700 13px var(--mono);color:#fff;background:#e91916;border-radius:6px;padding:4px 8px;white-space:nowrap}
.tag.ev-showcase{background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--violet)}
.tag.ev-salon{background:color-mix(in srgb,var(--online) 20%,transparent);color:var(--online)}
.tag.ev-ceremonie{background:color-mix(in srgb,var(--away) 22%,transparent);color:var(--away)}
.tag.ev-soldes,.tag.ev-autre{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.tag.ev-esport{background:color-mix(in srgb,#e91916 18%,transparent);color:#e5484d}
@media (max-width:560px){.evcard{grid-template-columns:52px minmax(0,1fr)}.evright{grid-column:2}}
/* Jeux gratuits */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fcard{display:grid;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--fg);font:inherit;cursor:pointer;padding:0;min-width:0}
.fcard:hover{border-color:var(--violet)}
.fcard:focus-visible{outline:2px solid var(--accent)}
.fimg{position:relative;display:block;aspect-ratio:460/215;background:var(--raise)}
.fimg img{width:100%;height:100%;object-fit:cover;display:block}
.fstore{position:absolute;left:8px;top:8px;background:rgb(10 8 20/.75);color:#fff;font:600 12px var(--body);padding:3px 8px;border-radius:6px}
.fbody{display:grid;gap:4px;padding:10px 12px 12px}
.fbody b{font:600 calc(16px*var(--ds))/1.25 var(--display);overflow-wrap:anywhere}
.fprice{display:flex;gap:8px;align-items:baseline}
.fprice s{color:var(--muted);font-size:14px}
.fprice em{font:700 14px var(--body);font-style:normal;color:var(--online);text-transform:uppercase;letter-spacing:.04em}
.fend{font:600 13px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.fbig{display:grid;gap:4px;background:var(--raise);border-radius:12px;padding:14px 16px}
.fbig span{color:var(--muted);font-size:14px}
.fbig b{font:700 calc(26px*var(--ns)) var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
/* Tendances */
.trank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trow{display:grid;grid-template-columns:36px 150px minmax(0,1fr) 96px 96px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 10px;color:var(--fg);font:inherit;cursor:pointer}
.trow:hover{border-color:var(--violet)}
.trow:focus-visible{outline:2px solid var(--accent)}
.tr{font:700 calc(20px*var(--ns)) var(--mono);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.twide{width:150px;aspect-ratio:460/215;object-fit:cover;border-radius:6px;display:block;background:var(--raise)}
.tn{display:grid;gap:2px;min-width:0}
.tn b{font:600 calc(16px*var(--ds)) var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv{display:grid;text-align:right}
.tv b{font:700 calc(17px*var(--ns)) var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:640px){.trow{grid-template-columns:28px 90px minmax(0,1fr) auto;gap:10px}.twide{width:90px}.hide-s{display:none}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbox{position:relative;display:grid;gap:4px;min-width:0}
.tbox img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--raise);display:block}
.tbox .tr{position:absolute;left:8px;top:8px;background:rgb(10 8 20/.75);color:#fff;border-radius:6px;padding:2px 8px;font-size:14px}
.tbox b{font:600 calc(15px*var(--ds)) var(--display);overflow-wrap:anywhere}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kvs div{display:grid;gap:2px;background:var(--raise);border-radius:10px;padding:12px}
.kvs b{font:700 calc(22px*var(--ns)) var(--mono);font-variant-numeric:tabular-nums}
.kvs span{color:var(--muted);font-size:13px}
/* Esport */
.mlistm{display:grid;gap:8px;margin-bottom:6px}
.mrowm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 130px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.mrowm.live{border-color:#e91916}
.lg{display:flex;gap:10px;align-items:center;min-width:0}
.lg img{width:32px;height:32px;object-fit:contain;flex:none}
.lg>span{display:grid;min-width:0}
.lg b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.team{display:flex;gap:8px;align-items:center;min-width:0}
.team.l{justify-content:flex-end;flex-direction:row-reverse}
.team img{width:30px;height:30px;object-fit:contain;flex:none}
.team i{width:30px;height:30px;border-radius:8px;background:var(--raise);display:grid;place-items:center;font:700 11px var(--mono);font-style:normal;flex:none}
.team b{font:600 calc(15px*var(--ds)) var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font:700 calc(22px*var(--ns)) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.score i{font-style:normal;color:var(--muted);margin:0 4px}
.vs{font:600 15px var(--mono);color:var(--muted);background:var(--raise);border-radius:6px;padding:4px 8px}
.mend{text-align:right}
@media (max-width:760px){.mrowm{grid-template-columns:1fr;gap:8px}.mend{text-align:left}}
/* Abonnements */
.tag.sv-gamepass{background:color-mix(in srgb,#107c10 22%,transparent);color:#3ccf5a}
.tag.sv-psplus{background:color-mix(in srgb,#0070d1 22%,transparent);color:#4aa3ff}
.tag.sv-ubisoft,.tag.sv-eaplay,.tag.sv-nso{background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--violet)}
footer{color:var(--muted);font-size:13px;padding-block:24px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.game,.btn,.chip,.ncard,.item{transition:border-color .15s,background .15s}}
</style>
