<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion Twitch · WTS Lobby</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#12101c;color:#ece9f5;font:16px system-ui,sans-serif}</style></head>
<body>
<p id="m">Connexion à Twitch…</p>
<script>
// retour de Twitch : on garde le jeton sur l'appareil, puis on revient au live
(function () {
  var h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  var back = "/#live";
  try { back = localStorage.getItem("lobby.twitchReturn") ? JSON.parse(localStorage.getItem("lobby.twitchReturn")) : back; } catch (e) {}
  var expected = null; try { expected = JSON.parse(localStorage.getItem("lobby.twitchState")); } catch (e) {}
  var token = h.get("access_token"), state = h.get("state");
  if (token && state && state === expected) {
    try { localStorage.setItem("lobby.twitchAuth", JSON.stringify({ token: token, at: Date.now() })); localStorage.removeItem("lobby.twitchState"); } catch (e) {}
    location.replace(back);
  } else {
    document.getElementById("m").textContent = q.get("error") === "access_denied" ? "Connexion Twitch annulée." : "La connexion Twitch n'a pas abouti.";
    setTimeout(function () { location.replace(back); }, 1500);
  }
})();
</script>
</body>
</html>
